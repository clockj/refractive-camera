[build-system]
requires = ["setuptools>=77", "pybind11>=2.10"]
build-backend = "setuptools.build_meta"

[project]
name = "refractive-camera"
version = "0.1.0.dev0"
description = "Camera models that see through cylindrical and spherical windows: every image of a 3-D point, or none."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shijie Zhong", email = "szhong12@jhu.edu" }]
keywords = ["refraction", "camera model", "computer vision", "robotics", "particle tracking", "Isaac Sim"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.23", "mpmath>=1.2"]

[project.optional-dependencies]
demo = ["matplotlib>=3.6", "scipy>=1.9", "pillow>=9"]
test = ["pytest>=7"]

[project.urls]
Paper = "https://arxiv.org/abs/2610.17413"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
